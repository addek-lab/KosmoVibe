name: Build Plugins

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: KosmoVibe-Windows
        path: |
          build/**/KosmoVibe.vst3
          build/**/KosmoVibe.exe
          build/**/KosmoVibe.vst3/

    - name: Upload Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: KosmoVibe-macOS
        path: |
          build/**/KosmoVibe.vst3
          build/**/KosmoVibe.component
          build/**/KosmoVibe.app
          build/**/KosmoVibe.vst3/
          build/**/KosmoVibe.component/
          build/**/KosmoVibe.app/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: KosmoVibe-Windows
          path: KosmoVibe-Windows
      
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: KosmoVibe-macOS
          path: KosmoVibe-macOS
          
      - name: Zip Artifacts
        run: |
          cd KosmoVibe-Windows && zip -r ../KosmoVibe-Windows.zip . && cd ..
          cd KosmoVibe-macOS && zip -r ../KosmoVibe-macOS.zip . && cd ..
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KosmoVibe-Windows.zip
            KosmoVibe-macOS.zip
